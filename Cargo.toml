[package]
name = "rgraphql"
description = "RGraphQL: a hand-rolled GraphQL query-language lexer, parser, and validation layer written from scratch in Rust (no existing GraphQL implementation reused). v0.2.0 covers the query-document tokenizer and a parser for query/mutation operations (field selections, nested selection sets, arguments, aliases, variable definitions, fragments, directives). v0.3.0 adds a first increment of schema-independent structural validation. No unsafe, no external parsing-crate dependency."
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
authors = ["RGraphQL Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aon-co-jp/RGraphQL"

[lints.rust]
unsafe_code = "deny"

[features]
# 既定はコアのみ(フレームワーク非依存)。
default = []
# RPoem/Poem(tokio/hyper)によるHTTP公開層アダプタ。v0.1.0ではアダプタ層の
# スタブ(`poem_adapter`モジュール)のみ有効化する。本実装(実際のpoem依存・
# 非同期ハンドラ)は次段階で、この配列にpoem等の依存を追加する。
poem = []

[dependencies]

[dev-dependencies]
